name: Build BlockFlow Automator (Windows)

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build Windows x64 (no publish)
        run: npx electron-builder --win --x64 --publish=never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Verify EXE output
        shell: pwsh
        run: |
          $exes = Get-ChildItem -Path dist -Filter *.exe -File
          if ($exes.Count -eq 0) {
            Write-Error 'Aucun fichier .exe n''a été généré dans dist.'
          }
          $exes | ForEach-Object { Write-Host "Generated: $($_.FullName)" }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BlockFlow-Automator-Windows-x64
          path: |
            dist/*.exe
            dist/*.blockmap
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release for version tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = Get-ChildItem -Path dist -File | Where-Object { $_.Extension -eq '.exe' -or $_.Extension -eq '.blockmap' } | ForEach-Object { $_.FullName }
          if (-not $files) {
            Write-Error 'Aucun artefact à publier.'
          }
          gh release create "${{ github.ref_name }}" $files `
            --title "BlockFlow Automator ${{ github.ref_name }}" `
            --generate-notes
